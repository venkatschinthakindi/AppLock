name: App Lock release build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # VERSIONING
      #
      # Version naming policy:
      #
      # Same month:
      #   1.0.0 -> 1.0.1 -> 1.0.2 -> ...
      #
      # New month:
      #   1.x.x -> 2.0.0
      #   2.x.x -> 3.0.0
      #
      # The first release is configured below as 1.0.0.
      # ------------------------------------------------------------
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_MAJOR=1
          BASE_YEAR_MONTH="2026-09"

          CURRENT_YEAR_MONTH="$(date -u +'%Y-%m')"

          echo "Current month: ${CURRENT_YEAR_MONTH}"
          echo "Base release month: ${BASE_YEAR_MONTH}"

          # Get the newest release version tag.
          LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)"

          if [[ -z "${LATEST_TAG}" ]]; then
            MAJOR="${BASE_MAJOR}"
            MINOR=0
            PATCH=0

            echo "No previous release tag found."
            echo "Starting release at ${MAJOR}.${MINOR}.${PATCH}"

          else
            LATEST_VERSION="${LATEST_TAG#v}"

            if [[ ! "${LATEST_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "ERROR: Latest tag '${LATEST_TAG}' is not a valid semantic version."
              echo "Expected format: v1.0.0"
              exit 1
            fi

            LAST_MAJOR="${BASH_REMATCH[1]}"
            LAST_MINOR="${BASH_REMATCH[2]}"
            LAST_PATCH="${BASH_REMATCH[3]}"

            # Find the month in which the latest release tag was created.
            LAST_RELEASE_DATE="$(git log -1 --format=%aI "${LATEST_TAG}")"
            LAST_YEAR_MONTH="$(date -u -d "${LAST_RELEASE_DATE}" +'%Y-%m')"

            echo "Latest tag: ${LATEST_TAG}"
            echo "Latest release month: ${LAST_YEAR_MONTH}"

            if [[ "${LAST_YEAR_MONTH}" == "${CURRENT_YEAR_MONTH}" ]]; then
              # Same month -> patch/minor release.
              MAJOR="${LAST_MAJOR}"
              MINOR="${LAST_MINOR}"
              PATCH=$((LAST_PATCH + 1))

            else
              # New month -> promote major version.
              MAJOR=$((LAST_MAJOR + 1))
              MINOR=0
              PATCH=0
            fi
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          # GitHub Actions run number is monotonic for this workflow.
          # It becomes Android versionCode.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          echo "VERSION_NAME=${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}"

          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------
      # Production AdMob safety checks
      # ------------------------------------------------------------
      - name: Check production AdMob configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'ca-app-pub-1267608571294570~6976756241' \
            app/src/main/AndroidManifest.xml

          grep -R -q 'ca-app-pub-1267608571294570/9300656932' \
            app/src/main/java/applock/app/ads/AdConfig.kt

          if grep -R -q 'USE_TEST_ADS[[:space:]]*=[[:space:]]*true' \
            app/src/main/java; then
            echo "ERROR: USE_TEST_ADS is still true."
            echo "Production AAB cannot be generated."
            exit 1
          fi

          echo "Production AdMob configuration passed."

      # ------------------------------------------------------------
      # Inject version into Gradle
      # ------------------------------------------------------------
      - name: Apply release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          python3 - <<PY
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {VERSION_CODE}',
              text,
              count=1
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{VERSION_NAME}"',
              text,
              count=1
          )

          if code_count != 1:
              raise SystemExit("Could not update versionCode exactly once.")

          if name_count != 1:
              raise SystemExit("Could not update versionName exactly once.")

          path.write_text(text)
          PY

          echo "Updated app/build.gradle.kts:"
          grep -nE 'versionCode|versionName' app/build.gradle.kts

      # ------------------------------------------------------------
      # Decode the Play upload keystore
      # ------------------------------------------------------------
      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/release-upload.jks

          test -s app/release-upload.jks

          echo "Release keystore restored."

      # ------------------------------------------------------------
      # Build signed production AAB
      # ------------------------------------------------------------
      - name: Build production AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # Verify AAB exists
      # ------------------------------------------------------------
      - name: Verify production AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "${AAB}" ]]; then
            echo "ERROR: Production AAB was not generated."
            exit 1
          fi

          echo "Production AAB:"
          ls -lh "${AAB}"

      # ------------------------------------------------------------
      # Upload AAB to GitHub Actions
      # ------------------------------------------------------------
      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      # ------------------------------------------------------------
      # Create Git tag for the versioning system
      # ------------------------------------------------------------
      - name: Create release tag
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "AppLock ${TAG}"
          git push origin "${TAG}"

          echo "Created release tag ${TAG}"

      # ------------------------------------------------------------
      # Clean signing material from runner
      # ------------------------------------------------------------
      - name: Remove release keystore
        if: always()
        shell: bash
        run: |
          rm -f app/release-upload.jks