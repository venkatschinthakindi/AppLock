name: App Lock release build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applock-production-release
  cancel-in-progress: false

jobs:
  build:
    name: Production AAB
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ------------------------------------------------------------
      # GRADLE
      # ------------------------------------------------------------
      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # VERSIONING
      #
      # Version naming policy:
      #
      # First release:
      #   1.0.0
      #
      # Same month:
      #   1.0.0 -> 1.0.1 -> 1.0.2 -> ...
      #
      # New month:
      #   1.x.x -> 2.0.0
      #   2.x.x -> 3.0.0
      #
      # Android versionCode:
      #   GitHub Actions workflow run number.
      # ------------------------------------------------------------
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_MAJOR=1
          BASE_YEAR_MONTH="2026-09"

          CURRENT_YEAR_MONTH="$(date -u +'%Y-%m')"

          echo "Current month: ${CURRENT_YEAR_MONTH}"
          echo "Base release month: ${BASE_YEAR_MONTH}"

          # Find newest valid semantic-version release tag.
          LATEST_TAG="$(
            git tag --list 'v*' --sort=-version:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 || true
          )"

          if [[ -z "${LATEST_TAG}" ]]; then

            MAJOR="${BASE_MAJOR}"
            MINOR=0
            PATCH=0

            echo "No previous release tag found."
            echo "Starting release at ${MAJOR}.${MINOR}.${PATCH}"

          else

            LATEST_VERSION="${LATEST_TAG#v}"

            if [[ ! "${LATEST_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "ERROR: Latest tag '${LATEST_TAG}' is not valid semantic versioning."
              echo "Expected format: v1.0.0"
              exit 1
            fi

            LAST_MAJOR="${BASH_REMATCH[1]}"
            LAST_MINOR="${BASH_REMATCH[2]}"
            LAST_PATCH="${BASH_REMATCH[3]}"

            LAST_RELEASE_DATE="$(
              git log -1 --format=%aI "${LATEST_TAG}"
            )"

            LAST_YEAR_MONTH="$(
              date -u -d "${LAST_RELEASE_DATE}" +'%Y-%m'
            )"

            echo "Latest tag: ${LATEST_TAG}"
            echo "Latest release month: ${LAST_YEAR_MONTH}"

            if [[ "${LAST_YEAR_MONTH}" == "${CURRENT_YEAR_MONTH}" ]]; then

              # Same month -> increment patch.
              MAJOR="${LAST_MAJOR}"
              MINOR="${LAST_MINOR}"
              PATCH=$((LAST_PATCH + 1))

            else

              # New month -> increment major and reset minor/patch.
              MAJOR=$((LAST_MAJOR + 1))
              MINOR=0
              PATCH=0

            fi
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          # GitHub Actions run number.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          if [[ ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Android versionCode: ${VERSION_CODE}"
            exit 1
          fi

          echo "----------------------------------------"
          echo "Release version: ${VERSION_NAME}"
          echo "Android versionCode: ${VERSION_CODE}"
          echo "----------------------------------------"

          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------
      # PRODUCTION ADMOB SAFETY CHECK
      # ------------------------------------------------------------
      - name: Check production AdMob configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          AD_CONFIG="app/src/main/java/applock/app/ads/AdConfig.kt"

          if [[ ! -f "${MANIFEST}" ]]; then
            echo "ERROR: ${MANIFEST} not found."
            exit 1
          fi

          if [[ ! -f "${AD_CONFIG}" ]]; then
            echo "ERROR: ${AD_CONFIG} not found."
            exit 1
          fi

          # Production AdMob application ID must exist.
          grep -q \
            'ca-app-pub-1267608571294570~6976756241' \
            "${MANIFEST}" || {
              echo "ERROR: Production AdMob application ID not found."
              exit 1
            }

          # Production banner unit ID must exist.
          grep -q \
            'ca-app-pub-1267608571294570/9300656932' \
            "${AD_CONFIG}" || {
              echo "ERROR: Production AdMob banner unit ID not found."
              exit 1
            }

          # Test ads must not be selected for production.
          if grep -R -q \
            'USE_TEST_ADS[[:space:]]*=[[:space:]]*true' \
            app/src/main/java; then

            echo "ERROR: USE_TEST_ADS is still true."
            echo "Production AAB cannot be generated."
            exit 1
          fi

          echo "Production AdMob configuration passed."

      # ------------------------------------------------------------
      # APPLY RELEASE VERSION
      # ------------------------------------------------------------
      - name: Apply release version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          echo "Applying release version:"
          echo "  versionName = ${VERSION_NAME}"
          echo "  versionCode = ${VERSION_CODE}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["VERSION_CODE"]

          path = Path("app/build.gradle.kts")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts was not found."
              )

          text = path.read_text(encoding="utf-8")

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              f'versionName = "{version_name}"',
              text,
              count=1,
          )

          if code_count != 1:
              raise SystemExit(
                  "ERROR: Could not update versionCode exactly once."
              )

          if name_count != 1:
              raise SystemExit(
                  "ERROR: Could not update versionName exactly once."
              )

          path.write_text(text, encoding="utf-8")

          print(
              f"Updated versionName={version_name}, "
              f"versionCode={version_code}"
          )
          PY

          echo ""
          echo "Final Gradle version:"
          grep -nE 'versionCode|versionName' app/build.gradle.kts

      # ------------------------------------------------------------
      # VALIDATE SIGNING SECRETS
      # ------------------------------------------------------------
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [[ -z "${KEYSTORE_PASSWORD}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_ALIAS}" ]]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "All signing secrets are configured."

      # ------------------------------------------------------------
      # RESTORE PLAY UPLOAD KEYSTORE
      # ------------------------------------------------------------
      
            # ------------------------------------------------------------
      # RESTORE PLAY UPLOAD KEYSTORE TO RUNNER TEMP DIRECTORY
      # ------------------------------------------------------------
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/applock-release.keystore
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" |
            base64 --decode > "${KEYSTORE_FILE}"

          if [[ ! -s "${KEYSTORE_FILE}" ]]; then
            echo "ERROR: Release keystore is empty."
            exit 1
          fi

          echo "Release keystore restored to temporary runner storage."
          echo "KEYSTORE_FILE=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"  

      # ------------------------------------------------------------
      # BUILD SIGNED PRODUCTION AAB
      # ------------------------------------------------------------
            # ------------------------------------------------------------
      # BUILD SIGNED PRODUCTION AAB
      # ------------------------------------------------------------
      
      - name: Build production AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/applock-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -f "${KEYSTORE_FILE}" ]]; then
            echo "ERROR: Signing keystore was not restored."
            exit 1
          fi

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # VERIFY AAB
      # ------------------------------------------------------------
      - name: Verify production AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "${AAB}" ]]; then
            echo "ERROR: Production AAB was not generated."
            exit 1
          fi

          if [[ ! -s "${AAB}" ]]; then
            echo "ERROR: Production AAB is empty."
            exit 1
          fi

          echo "Production AAB generated successfully:"
          ls -lh "${AAB}"

      # ------------------------------------------------------------
      # UPLOAD AAB TO GITHUB ACTIONS
      # ------------------------------------------------------------
      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      # ------------------------------------------------------------
      # CREATE GIT RELEASE TAG
      # ------------------------------------------------------------
      - name: Create release tag
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "AppLock ${TAG}"
          git push origin "${TAG}"

          echo "Created release tag ${TAG}"

      # ------------------------------------------------------------
      # CLEAN SIGNING MATERIAL
      # ------------------------------------------------------------
            # ------------------------------------------------------------
      # CLEAN SIGNING MATERIAL
      # ------------------------------------------------------------
      - name: Remove release keystore
        if: always()
        shell: bash
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/applock-release.keystore"

          rm -f "${KEYSTORE_FILE}"

          if [[ -f "${KEYSTORE_FILE}" ]]; then
            echo "WARNING: Release keystore could not be removed."
            exit 1
          fi

          echo "Temporary release keystore removed."